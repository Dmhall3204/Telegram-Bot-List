global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - job_name: conductor
    static_configs: [{targets: ["conductor:8080"]}]
  - job_name: vllm
    authorization: {credentials_file: /etc/prometheus/vllm_api_key}
    static_configs:
      - targets: [vllm-conductor:8000, vllm-fast:8000, vllm-code:8000, vllm-reasoning:8000, vllm-vision:8000, vllm-long-ctx:8000]
