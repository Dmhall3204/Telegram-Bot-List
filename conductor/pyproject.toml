[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor"
version = "0.3.0"
description = "Hierarchical mixture-of-experts orchestration: a sparse MoE Conductor routing across MoE specialists"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "prometheus-client>=0.20",
  "redis>=5.0",
  "opentelemetry-api>=1.25",
]

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fakeredis>=2.23"]

[project.scripts]
conductor = "conductor.server:main"

[tool.setuptools]
packages = ["conductor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
